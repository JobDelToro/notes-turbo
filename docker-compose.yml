# One-command local stack: Postgres + NestJS API + Next.js web.
#   docker compose up --build
# Values interpolate from a local .env (see .env.example); all have safe defaults.

services:
  db:
    # Pinned to 17: postgres:18-alpine fails to start in this stack; 17 is the
    # known-good image and matches the prod-parity target in docs/architecture.md.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # TypeORM creates the schema on first boot (synchronize); then it serves.
    environment:
      NODE_ENV: production
      PORT: "8000"
      DATABASE_URL: postgres://notes:notes@db:5432/notes
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-llama-3.1-8b-instant}
      LLM_GENERATOR_MODEL: ${LLM_GENERATOR_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing API URL, inlined into the build (published backend port).
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
